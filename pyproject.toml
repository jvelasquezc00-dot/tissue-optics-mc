[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tissuemc"
version = "0.2.0"
description = "Vectorized Monte Carlo simulation of light transport in turbid media (MCML-style) for tissue optics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "José Alejandro Velásquez Castaño" }]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
examples = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["tissuemc"]
